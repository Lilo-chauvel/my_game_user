info:
  name: Create user
  type: http

http:
  method: POST
  url: http://localhost:8081/users
  body:
    type: json
    data: |-
      {
        "id":1,
        "name":"Lilo",
        "password":"123",
        "role":"admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
